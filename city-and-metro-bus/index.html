  <script>
    // 首帧即应用主题，避免浅色闪烁
    (function () {
      var s = null, t = 'auto';
      try { s = JSON.parse(localStorage.getItem('cm1.settings') || 'null'); t = (s && s.theme) || localStorage.getItem('cm1.theme') || 'auto'; } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      var z = s && Number(s.uiScale) > 0 && isFinite(Number(s.uiScale)) ? Number(s.uiScale) : 1;
      if (window.matchMedia && window.matchMedia('(max-width: 760px), (max-width: 1024px) and (max-height: 520px) and (pointer: coarse)').matches) z = Math.max(0.85, z * 0.9);
      document.documentElement.style.setProperty('--uiz', String(z));
    })();
  </script>

  <script>
    // 启动自检（v3.22.1）：脚本报错或迟迟没起来时，直接在页面上说明原因，而不是留一片白屏。
    // 只在游戏还没启动成功时介入；游戏跑起来后的运行期错误仍由它自己的提示处理。
    (function () {
      var box = null;
      function booted() { return !!(window.CM && window.CM.MAP_ORDER && window.CM.MAP_ORDER.length); }
      function show(text) {
        if (booted()) return;
        if (!box) {
          box = document.createElement('div');
          box.setAttribute('data-role', 'boot-error');
          box.style.cssText = 'position:fixed;left:16px;right:16px;top:16px;z-index:2147483647;background:#fff;color:#222;' +
            'border:1px solid #d33;border-radius:10px;padding:14px 16px;font:13px/1.65 system-ui,"Microsoft YaHei",sans-serif;' +
            'box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:70vh;overflow:auto';
          box.innerHTML = '<div style="font-weight:700;color:#c00;margin-bottom:4px">游戏没能正常启动</div>' +
            '<div style="color:#555;margin-bottom:8px">把下面这段文字（含浏览器信息）发给作者即可定位。' +
            '也可以先用 Chrome / Edge / Firefox 双击打开本文件再试一次。</div>';
          var pre = document.createElement('pre');
          pre.style.cssText = 'white-space:pre-wrap;word-break:break-all;background:#f5f6f8;border-radius:6px;padding:10px;margin:0';
          box.appendChild(pre);
          (document.body || document.documentElement).appendChild(box);
          box._pre = pre;
        }
        box._pre.textContent += (box._pre.textContent ? '\n' : '') + text;
      }
      window.addEventListener('error', function (e) {
        if (!e || !e.message) return;                       // 资源加载失败之类没有 message，忽略
        show('脚本错误：' + e.message + (e.filename ? '\n  ' + e.filename + (e.lineno ? ':' + e.lineno : '') : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e && e.reason;
        show('异步异常：' + ((r && (r.message || r)) || '未知'));
      });
      setTimeout(function () {
        if (booted()) return;
        var hint = location.protocol === 'file:'
          ? '\n提示：若你是从压缩包里直接双击 index.html，Windows 只会解出这一个文件、js/ 并不在，必然白屏。' +
            '请先解压整个文件夹（双击 启动游戏.bat），或改用 马鞍山地图-单文件版.html。'
          : '';
        show('20 秒内没有完成启动：可能是网络较慢（网页版要下载约 2.4 MB 脚本）、浏览器版本过低（不支持现代 JavaScript），' +
          '或页面脚本被拦截。若稍后已经进入游戏，这条提示会自动消失。' + hint + '\n浏览器：' + navigator.userAgent);
      }, 20000);
      // v3.75：慢网或老机器上启动可能晚于阈值，提示弹出后一旦启动成功就撤掉，别让玩家对着红框玩游戏
      var watchdog = setInterval(function () {
        if (!booted()) return;
        clearInterval(watchdog);
        if (box && box.parentNode) box.parentNode.removeChild(box);
        box = null;
      }, 500);
    })();
  </script>
